<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>EX60 visual model smoke test</title>
  <style>body { margin: 0; background: #e5e7ea; } canvas { display: block; } pre { position: absolute; top: 0; color: #17212b; background: #ffffffdd; }</style>
  <script type="importmap">
    { "imports": { "three": "../viewer/vendor/three.module.js" } }
  </script>
</head>
<body>
<pre id="result">RUNNING</pre>
<script type="module">
import * as THREE from 'three';
import * as K from '../viewer/kinematics.js';
import { Ex60Scene, studioEnvironment } from '../viewer/model.js';

try {
  const response = await fetch('../data/ex60_spec.json');
  if (!response.ok) throw new Error(`Spec fetch failed: ${response.status}`);
  const spec = await response.json();
  const car = new Ex60Scene(spec);
  const remodel = spec.visual_reconstruction.reference_remodel.value;
  const windscreen = car.root.getObjectByName('windshield_1');
  const wp = windscreen.geometry.getAttribute('position'), wd = remodel.windscreen;
  if (wp.count !== (wd.columns + 1) * (wd.rows + 1)) throw new Error('Windscreen sampling changed.');
  const corners = spec.visual_reconstruction.glazing.find((p) => p.name === 'windshield').points.map((p) => new THREE.Vector3(...p));
  const wn = new THREE.Vector3().crossVectors(corners[1].clone().sub(corners[0]), corners[3].clone().sub(corners[0])).normalize();
  if (wn.z < 0) wn.negate();
  const surfacePoint = (u, t) => corners[0].clone().lerp(corners[1], u).lerp(
    corners[3].clone().lerp(corners[2], u), t).addScaledVector(wn, wd.bow_mm * Math.sin(Math.PI * u) * Math.sin(Math.PI * t));
  let glassBow = 0;
  for (let col = 0; col <= wd.columns; col++) {
    for (let row = 0; row <= wd.rows; row++) {
      const actual = new THREE.Vector3().fromBufferAttribute(wp, col * (wd.rows + 1) + row);
      if (actual.distanceTo(surfacePoint(col / wd.columns, row / wd.rows)) > 0.001) throw new Error('Windscreen spec curvature mismatch.');
      glassBow = Math.max(glassBow, actual.clone().sub(corners[0]).dot(wn));
    }
  }
  if (Math.abs(glassBow - wd.bow_mm) > 0.001) throw new Error('Windscreen flattened or not non-coplanar.');
  for (let edge = 0; edge < 4; edge++) {
    const trim = car.root.getObjectByName(`windscreen_matched_surround_${edge}`).geometry.getAttribute('position');
    for (let col = 0; col <= wd.columns; col++) {
      const u = col / wd.columns, f = wd.surround_fraction;
      const [a, b] = [[u, f], [1 - f, u], [1 - u, 1 - f], [f, 1 - u]][edge];
      const expected = surfacePoint(a, b).addScaledVector(wn, wd.surround_offset_mm);
      if (new THREE.Vector3().fromBufferAttribute(trim, col * 3 + 2).distanceTo(expected) > 0.001) {
        throw new Error('Windscreen surround does not follow curved glass.');
      }
    }
  }
  const layout = spec.visual_reconstruction.cabin_seating.value;
  const passenger = car.root.getObjectByName('passenger_static_seat');
  if (passenger.position.distanceTo(new THREE.Vector3(...layout.passenger_h_point)) > 1e-8) throw new Error('Passenger symmetry changed.');
  for (const [i, y] of layout.rear_centers_y_mm.entries()) {
    const seat = car.root.getObjectByName(`rear_static_seat_${i}`);
    if (seat.position.distanceTo(new THREE.Vector3(layout.rear_x_mm, y, layout.rear_z_mm)) > 1e-8) throw new Error('Rear three-place layout changed.');
  }
  const dim = car.root.getObjectByName('display_driver');
  const dimCenter = spec.displays.driver.center;
  if (dim.position.distanceTo(new THREE.Vector3(dimCenter.x, dimCenter.y, dimCenter.z)) > 1e-8) throw new Error('DIM visual center diverged.');
  dim.updateMatrixWorld(true);
  for (const [i, edge] of K.driverDisplayEdges(spec).entries()) {
    const point = new THREE.Vector3(0, (i === 0 ? 1 : -1) * spec.displays.driver.h / 2, 0).applyMatrix4(dim.matrix);
    if (point.distanceTo(new THREE.Vector3(...edge)) > 1e-6) throw new Error('DIM display/metric edge mismatch.');
  }
  const refinement = spec.visual_reconstruction.exterior_refinement.value;
  const hood = car.root.getObjectByName('sculpted_hood');
  const hoodVertices = hood.geometry.getAttribute('position');
  const hoodStride = refinement.deck_rows + 1;
  let maxCrown = 0;
  for (let i = 0; i < hoodVertices.count; i += hoodStride) {
    const center = i + refinement.deck_rows / 2;
    maxCrown = Math.max(maxCrown, hoodVertices.getZ(center) - hoodVertices.getZ(i));
  }
  if (maxCrown < 30 || hoodVertices.count < 400 ||
      hoodVertices.count >= hood.geometry.index.count / 2) {
    throw new Error('Hood curvature/shared-vertex topology regressed.');
  }
  if (hoodVertices.getX(0) - hoodVertices.getX(refinement.deck_rows / 2) < 40) {
    throw new Error('Rounded hood leading-edge planform regressed.');
  }
  const fasciaVertices = car.root.getObjectByName('front_fascia').geometry.getAttribute('position');
  for (let i = 0; i <= refinement.deck_rows; i++) {
    const fascia = new THREE.Vector3().fromBufferAttribute(fasciaVertices, i * (refinement.end_rows + 1) + refinement.end_rows);
    const leadingEdge = new THREE.Vector3().fromBufferAttribute(hoodVertices, i);
    if (fascia.distanceTo(leadingEdge) > 0.05) throw new Error('Nose/hood leading seam is open.');
  }
  for (const [paneName, meshName, atEnd] of [
    ['windshield', 'sculpted_hood', true], ['rear_window', 'liftgate_upper_shoulder', false],
  ]) {
    const corners = spec.visual_reconstruction.glazing.find((p) => p.name === paneName).points;
    const vertices = car.root.getObjectByName(meshName).geometry.getAttribute('position');
    const offset = atEnd ? vertices.count - hoodStride : 0;
    for (const corner of paneName === 'windshield' ? corners.slice(0, 2) : corners.slice(2)) {
      let seamError = Infinity;
      for (let row = 0; row < refinement.deck_rows; row++) {
        const i = offset + row;
        if (corner[1] < vertices.getY(i) || corner[1] > vertices.getY(i + 1)) continue;
        const t = (corner[1] - vertices.getY(i)) / (vertices.getY(i + 1) - vertices.getY(i));
        seamError = Math.abs(corner[2] - THREE.MathUtils.lerp(vertices.getZ(i), vertices.getZ(i + 1), t));
      }
      if (seamError > 3) throw new Error(`Open glazing/deck seam: ${paneName}`);
    }
  }
  for (const side of [-1, 1]) {
    const panel = car.root.getObjectByName(`painted_side_panel_${side}`);
    const vertices = panel.geometry.getAttribute('position'), stride = refinement.side_rows + 1;
    if (vertices.count >= panel.geometry.index.count / 2) throw new Error('Side normals are no longer shared.');
    const edgeMap = new Map();
    for (let i = stride - 1; i < vertices.count; i += stride) {
      edgeMap.set(vertices.getX(i), new THREE.Vector3().fromBufferAttribute(vertices, i));
    }
    for (let i = side < 0 ? 0 : refinement.deck_rows; i < hoodVertices.count; i += hoodStride) {
      const p = new THREE.Vector3().fromBufferAttribute(hoodVertices, i);
      if (!edgeMap.has(p.x) || edgeMap.get(p.x).distanceTo(p) > 0.05) {
        throw new Error('Hood/shoulder seam is open.');
      }
    }
    let lowerDoorSculpt = 0;
    for (let i = 0; i < vertices.count; i += stride) {
      if (vertices.getX(i) < 1200 || vertices.getX(i) > 2000) continue;
      const topWidth = Math.abs(vertices.getY(i + stride - 1));
      for (let row = 1; row < stride - 1; row++) {
        lowerDoorSculpt = Math.max(lowerDoorSculpt, topWidth - Math.abs(vertices.getY(i + row)));
      }
    }
    if (lowerDoorSculpt < 25) throw new Error('Lower door concavity regressed.');
  }
  const roofVertices = [];
  car.layers.body_roof.traverse((object) => {
    if (!object.name.startsWith('fitted_roof_surround_')) return;
    const p = object.geometry.getAttribute('position');
    for (let i = 0; i < p.count; i++) roofVertices.push(new THREE.Vector3().fromBufferAttribute(p, i));
  });
  for (const corner of spec.visual_reconstruction.glazing.find((p) => p.name === 'panoramic_roof').points) {
    if (Math.min(...roofVertices.map((p) => p.distanceTo(new THREE.Vector3(...corner)))) > 0.05) {
      throw new Error('Panoramic aperture/roof seam is open.');
    }
  }
  const inspection = spec.visual_reconstruction.inspection_transparency.value;
  for (const side of [-1, 1]) {
    const panel = car.root.getObjectByName(`painted_side_panel_${side}`);
    const door = panel.material[1];
    if (!door.transparent || door.depthWrite || door.opacity !== inspection.door_opacity) {
      throw new Error('Door transparency is not applied.');
    }
    if (!panel.geometry.groups.some((group) => group.materialIndex === 1) ||
        !panel.geometry.groups.some((group) => group.materialIndex === 0)) {
      throw new Error('Transparent doors must retain opaque fenders.');
    }
  }
  car.layers.body_roof.traverse((object) => {
    if (object.isMesh && (!object.material.transparent || object.material.depthWrite ||
        object.material.opacity !== inspection.roof_opacity)) {
      throw new Error(`Roof transparency is not applied: ${object.name}`);
    }
  });
  if (car.root.getObjectByName('panoramic_roof_1').material.opacity !== spec.visual_reconstruction.roof_glass_opacity) {
    throw new Error('Panoramic roof transparency is not applied.');
  }
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xe5e7ea);
  scene.add(car.root, new THREE.HemisphereLight(0xffffff, 0x606574, 2));
  const sun = new THREE.DirectionalLight(0xffffff, 1.6);
  sun.position.set(-3, 6, 4);
  scene.add(sun);
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  scene.environment = studioEnvironment(renderer, spec);
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);
  const metrics = {};
  const visibilityModes = { above_rim: {}, through_wheel: {} };
  for (const name of Object.keys(spec.manikins)) {
    car.update(K.designState(spec), name);
    metrics[name] = K.ergoMetrics(spec, K.designState(spec), name);
    for (const [prefix, point] of [
      ['h', K.hPoint(spec, K.designState(spec))],
      ['eye', K.eyePoint(spec, K.designState(spec), name)],
      ['wheel', K.wheelCenter(spec, K.designState(spec))],
    ]) {
      for (const [i, axis] of ['x', 'y', 'z'].entries()) metrics[name][`${prefix}_${axis}`] = point[i];
    }
    if (!Object.values(metrics[name]).every(Number.isFinite)) throw new Error(`Non-finite metrics: ${name}`);
    for (const mode of Object.keys(visibilityModes)) {
      const alternate = structuredClone(spec);
      alternate.displays.driver.visibility_mode = mode;
      visibilityModes[mode][name] = K.clusterSightlineMargin(alternate, K.designState(spec), name);
    }
  }
  const invalid = structuredClone(spec);
  invalid.displays.driver.visibility_mode = 'invalid';
  let rejected = false;
  try { K.clusterSightlineMargin(invalid, K.designState(spec), 'p50_male'); } catch { rejected = true; }
  if (!rejected) throw new Error('Invalid DIM visibility mode accepted.');
  const legacy = structuredClone(spec);
  legacy.displays.driver.center = { x: 640, y: -370, z: 1075 };
  legacy.displays.driver.tilt_deg = 20;
  delete legacy.displays.driver.visibility_mode;
  if (Math.abs(K.clusterSightlineMargin(legacy, K.designState(legacy), 'p50_male') - 13.5) > 0.1) throw new Error('Legacy DIM routing regressed.');
  const closeVector = (actual, expected, label) => {
    if (actual.distanceTo(new THREE.Vector3(...expected)) > 1e-5) throw new Error(label);
  };
  for (const [part, frame] of [
    ['cushion_rounded', car.cushion], ['cushion_insert', car.cushion],
    ['cushion_bolster_left', car.cushion], ['cushion_bolster_right', car.cushion],
    ['back_rounded', car.back], ['shoulder_panel', car.back], ['headrest_rounded', car.back],
  ]) {
    const mesh = frame.getObjectByName(`seat_${part}`);
    if (!mesh?.isMesh || mesh.geometry.type !== 'BufferGeometry' ||
        mesh.geometry.getAttribute('position').count <= 24) {
      throw new Error(`Missing rounded seat contour: ${part}`);
    }
    const parameter = spec.visual_reconstruction.seat_detail.value.parts.find((p) => p.name === part);
    closeVector(mesh.parent.position, parameter.center, `Seat detail center changed: ${part}`);
  }
  const limits = K.channelRanges(spec);
  const steering = spec.visual_reconstruction.dashboard.steering_trim;
  const wheelRadius = spec.steering.rim_diameter.value / 2;
  const tubeRadius = spec.steering.rim_thickness.value / 2;
  const rim = car.wheelSpin.getObjectByName('steering_rounded_square_rim');
  if (!rim?.isMesh || rim.geometry.type !== 'BufferGeometry' ||
      rim.geometry.getAttribute('position').count !== (steering.rim.segments + 1) * (steering.rim.cross_segments + 1) ||
      rim.geometry.groups.length !== 2) throw new Error('Rounded-square two-tone steering rim missing');
  for (const [index, material] of rim.material.entries()) {
    const settings = steering.materials[index === 0 ? 'leather' : 'dark_leather'];
    if (!material.bumpMap?.isDataTexture || material.roughnessMap !== material.bumpMap ||
        material.bumpScale !== settings.bumpScale || !material.color.equals(new THREE.Color(settings.color)) ||
        !rim.geometry.getAttribute('uv')) {
      throw new Error('Procedural steering leather texture is not assigned');
    }
  }
  const rimPositions = rim.geometry.getAttribute('position');
  for (let i = 0; i < rimPositions.count; i++) {
    if (Math.abs(rimPositions.getX(i)) > wheelRadius + tubeRadius + 1e-4 ||
        Math.abs(rimPositions.getY(i)) > wheelRadius + tubeRadius + 1e-4 ||
        Math.abs(rimPositions.getZ(i)) > tubeRadius + 1e-4) {
      throw new Error('Steering rim escaped its original design envelope');
    }
  }
  for (let cardinal = 0; cardinal < 4; cardinal++) {
    const index = cardinal * steering.rim.segments / 4 * (steering.rim.cross_segments + 1);
    const angle = cardinal * Math.PI / 2;
    closeVector(new THREE.Vector3().fromBufferAttribute(rimPositions, index),
      [(wheelRadius + tubeRadius) * Math.cos(angle), (wheelRadius + tubeRadius) * Math.sin(angle), 0],
      'Steering cardinal grip radius changed');
  }
  const diagonal = steering.rim.segments / 8 * (steering.rim.cross_segments + 1);
  if (Math.hypot(rimPositions.getX(diagonal), rimPositions.getY(diagonal)) <= wheelRadius + tubeRadius + 10) {
    throw new Error('Steering contour reverted to a circular torus');
  }
  const stitches = car.wheelSpin.getObjectByName('steering_rim_cross_stitches');
  if (!stitches?.isInstancedMesh || stitches.count !== steering.seam.stitch_count ||
      ![...stitches.instanceMatrix.array].every(Number.isFinite)) {
    throw new Error('Physical steering rim stitches are missing/invalid');
  }
  for (const name of ['hub_cushion', 'hub_back_shell', 'hub_satin_accent', 'blank_badge',
    'badge_satin_ring', 'lower_open_trim', 'lower_satin_accent',
    'spoke_-1', 'spoke_1', 'control_island_-1', 'control_island_1',
    'rocker_-1', 'rocker_1', 'button_-1_0', 'button_1_1']) {
    if (!car.wheelSpin.getObjectByName(`steering_${name}`)?.isMesh) {
      throw new Error(`Missing physical steering detail: ${name}`);
    }
  }
  if (car.wheelSpin.getObjectByName('steering_hub_cushion').material.bumpMap !== rim.material[0].bumpMap) {
    throw new Error('Hub cushion must share the original procedural leather grain');
  }
  const geometryBefore = rim.geometry;
  for (const endpoint of ['min', 'max', 'zero', 'replay']) {
    const pose = K.designState(spec);
    for (const channel of ['steer_tilt', 'steer_telescope', 'steer_wheel_angle']) {
      if (!limits[channel]) throw new Error(`Unknown steering test channel: ${channel}`);
      pose[channel] = endpoint === 'zero' ? 0 : endpoint === 'replay' ?
        THREE.MathUtils.lerp(limits[channel].min, limits[channel].max, 0.63) : limits[channel][endpoint];
    }
    car.update(pose, 'p50_male');
    car.root.updateMatrixWorld(true);
    if (passenger.position.distanceTo(new THREE.Vector3(...layout.passenger_h_point)) > 1e-8 ||
        passenger.getObjectByName('seat_back_recline_frame').rotation.y !== THREE.MathUtils.degToRad(layout.front_back_angle_deg)) {
      throw new Error('Driver replay leaked into static passenger seat.');
    }
    closeVector(car.wheelFrame.position, K.wheelCenter(spec, pose), 'Steering wheel center changed');
    closeVector(new THREE.Vector3(0, 0, 1).applyQuaternion(car.wheelFrame.quaternion),
      K.steeringAxis(spec, pose), 'Driver-facing steering normal changed');
    if (Math.abs(car.wheelSpin.rotation.z - THREE.MathUtils.degToRad(pose.steer_wheel_angle)) > 1e-8 ||
        rim.geometry !== geometryBefore) throw new Error('Steering spin/replay rebuilt or detached the detail');
    car.wheelSpin.traverse((object) => {
      if (!object.isMesh) return;
      if (![...object.matrixWorld.elements].every(Number.isFinite)) throw new Error('Non-finite steering transform');
      const position = object.geometry.getAttribute('position');
      for (let i = 0; i < position.count; i++) {
        const world = new THREE.Vector3().fromBufferAttribute(position, i).applyMatrix4(object.matrixWorld);
        if (!world.toArray().every(Number.isFinite)) throw new Error(`Non-finite posed steering vertex: ${object.name}`);
      }
    });
  }
  for (const endpoint of ['min', 'max', 'zero']) {
    const pose = K.designState(spec);
    for (const channel of ['seat_x', 'seat_z', 'seat_cushion_tilt', 'seat_back_angle']) {
      if (endpoint !== 'zero') pose[channel] = limits[channel][endpoint];
    }
    for (const k of K.MIRRORS) {
      for (const axis of ['yaw', 'pitch']) {
        const channel = `mirror_${k}_${axis}`;
        pose[channel] = endpoint === 'zero' ? 0 : limits[channel][endpoint];
      }
    }
    car.update(pose, 'p50_male');
    car.root.updateMatrixWorld(true);
    closeVector(car.seat.position, K.hPoint(spec, pose), 'Seat H-point pivot changed');
    closeVector(car.back.position, spec.visual_reconstruction.seat_detail.value.back_pivot, 'Back pivot changed');
    if (Math.abs(car.cushion.rotation.y - THREE.MathUtils.degToRad(pose.seat_cushion_tilt)) > 1e-8 ||
        Math.abs(car.back.rotation.y - THREE.MathUtils.degToRad(pose.seat_back_angle)) > 1e-8) {
      throw new Error('Seat detail does not follow cushion tilt/recline');
    }
    for (const k of K.MIRRORS) {
      const { group, glass, center } = car.mirrors[k];
      closeVector(group.position, center, `Mirror pivot changed: ${k}`);
      closeVector(glass.position, [0, 0, 0], `Glass is offset from normal pivot: ${k}`);
      const normal = new THREE.Vector3(0, 0, 1).applyQuaternion(group.quaternion);
      closeVector(normal, K.mirrorNormal(...K.mirrorAngles(pose, k)), `Incorrect glass normal: ${k}`);
      const geometryNormal = new THREE.Vector3().fromBufferAttribute(glass.geometry.getAttribute('normal'), 0);
      closeVector(geometryNormal, [0, 0, 1], `Incorrect local glass normal: ${k}`);
      for (const name of ['sculpted_housing', 'rim']) {
        const mesh = group.getObjectByName(`mirror_${k}_${name}`);
        if (!mesh?.isMesh || mesh.geometry.getAttribute('position').count <= 24) {
          throw new Error(`Missing rounded mirror detail: ${k}/${name}`);
        }
      }
      const vertices = glass.geometry.getAttribute('position');
      for (let i = 0; i < vertices.count; i++) {
        if (vertices.getZ(i) !== 0 ||
            Math.abs(vertices.getX(i)) > spec.mirrors[k].glass_size.w / 2 + 1e-5 ||
            Math.abs(vertices.getY(i)) > spec.mirrors[k].glass_size.h / 2 + 1e-5) {
          throw new Error(`Glass departed from metric envelope/plane: ${k}`);
        }
      }
    }
  }
  car.update(K.designState(spec), 'p50_male');
  let meshes = 0;
  car.root.traverse((object) => {
    if (!object.isMesh) return;
    meshes++;
    const position = object.geometry.getAttribute('position');
    if (![...position.array].every(Number.isFinite)) {
      throw new Error(`Non-finite vertices: ${object.name}`);
    }
    const normals = object.geometry.getAttribute('normal');
    if (normals && ![...normals.array].every(Number.isFinite)) throw new Error(`Non-finite normals: ${object.name}`);
    if (object.name.startsWith('painted_side_panel') || object.name === 'sculpted_hood' ||
        object.name === 'front_fascia' || object.name === 'tailgate') {
      for (let i = 0; i < position.count; i++) {
        if (position.getX(i) < -1000 || position.getX(i) > 4000 ||
            Math.abs(position.getY(i)) > 970 || position.getZ(i) < 300 || position.getZ(i) > 1640) {
          throw new Error(`Exterior shell escaped visual envelope: ${object.name}`);
        }
      }
    }
    object.geometry.computeBoundingSphere();
    if (!Number.isFinite(object.geometry.boundingSphere.radius)) {
      throw new Error(`Invalid bounds: ${object.name}`);
    }
  });
  const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.01, 100);
  const dashboard = new URLSearchParams(location.search).has('dashboard');
  const steeringView = new URLSearchParams(location.search).has('steering');
  const details = new URLSearchParams(location.search).has('details');
  const view = new URLSearchParams(location.search).get('view');
  for (const name of ['r46_zones', 'sightlines', 'eyellipse', 'markers', 'manikin']) {
    car.layers[name].visible = false;
  }
  if (steeringView) {
    for (const layer of Object.values(car.layers)) layer.visible = false;
    car.layers.steering.visible = true;
    const center = K.wheelCenter(spec, K.designState(spec));
    const axis = K.steeringAxis(spec, K.designState(spec));
    const eye = K.add(center, K.scale(axis, 780));
    if (view === 'oblique') {
      eye[1] += 300;
      eye[2] += 100;
    }
    camera.position.copy(car.toWorld(eye));
    camera.up.copy(car.toWorld(K.add(center, K.wheelUp(spec, K.designState(spec))))).sub(car.toWorld(center)).normalize();
    camera.lookAt(car.toWorld(center));
  } else if (details) {
    for (const name of ['body', 'body_roof', 'body_glazing', 'exterior_details']) car.layers[name].visible = false;
    camera.position.copy(car.toWorld([-900, -2450, 2150]));
    camera.lookAt(car.toWorld([1120, -270, 950]));
  } else if (dashboard) {
    for (const name of ['body', 'body_roof', 'body_glazing', 'exterior_details', 'seat', 'cabin_seating', 'wheels']) {
      car.layers[name].visible = false;
    }
    camera.position.copy(car.toWorld([2200, -180, 1300]));
    camera.lookAt(car.toWorld([570, 0, 1000]));
  } else if (view === 'top' || view === 'seats' || view === 'upholstery') {
    for (const name of ['body', 'body_roof', 'body_glazing', 'exterior_details', 'wheels']) car.layers[name].visible = false;
    if (view === 'top') {
      camera.position.copy(car.toWorld([1650, 0, 5500]));
      camera.up.set(-1, 0, 0);
      camera.lookAt(car.toWorld([1650, 0, 700]));
    } else if (view === 'upholstery') {
      car.layers.cabin_seating.visible = false;
      car.layers.steering.visible = false;
      car.layers.mirrors.visible = false;
      camera.position.copy(car.toWorld([600, -1300, 1400]));
      camera.lookAt(car.toWorld([1440, -370, 1030]));
    } else {
      camera.position.copy(car.toWorld([200, -2100, 1950]));
      camera.lookAt(car.toWorld([1900, 0, 950]));
    }
  } else if (view === 'side') {
    camera.position.copy(car.toWorld([1450, -7800, 1600]));
    camera.lookAt(car.toWorld([1450, 0, 840]));
  } else if (view === 'rear') {
    camera.position.copy(car.toWorld([7600, -4700, 2700]));
    camera.lookAt(car.toWorld([1850, 0, 850]));
  } else if (view === 'front') {
    camera.position.copy(car.toWorld([-4600, -4000, 2400]));
    camera.lookAt(car.toWorld([1100, 0, 800]));
  } else {
    camera.position.copy(car.toWorld([-5000, -5500, 3300]));
    camera.lookAt(car.toWorld([1400, 0, 800]));
  }
  renderer.render(scene, camera);
  const error = renderer.getContext().getError();
  if (error !== 0) throw new Error(`WebGL error: ${error}`);
  const output = document.getElementById('result');
  output.textContent = JSON.stringify({
    status: 'PASS', meshes, rendered_triangles: renderer.info.render.triangles,
    hood_crown_mm: maxCrown, windscreen_bow_mm: glassBow, metrics, visibility_modes: visibilityModes,
  });
  output.dataset.status = 'pass';
  if (new URLSearchParams(location.search).has('screenshot')) output.hidden = true;
} catch (error) {
  document.getElementById('result').textContent = `FAIL: ${error.stack || error}`;
  document.getElementById('result').dataset.status = 'fail';
  throw error;
}
</script>
</body>
</html>
